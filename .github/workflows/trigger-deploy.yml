name: Disparar deploy (ThneppelWebsite)

# Cada push na main pede ao repositório ThneppelWebsite para gerar e publicar o site.
on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar dispatch para Thneppel/ThneppelWebsite
        run: |
          curl -fsS -X POST \
            -H "Authorization: token ${{ secrets.PERSONAL_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Thneppel/ThneppelWebsite/dispatches \
            -d '{"event_type": "trigger-site"}'
