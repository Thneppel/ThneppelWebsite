name: Deploy (site em Astro)

on:
  push:
    branches: [ main ]
  # Permite disparo manual
  workflow_dispatch:
  # Disparo vindo do repositório do site (ThneppelSite). Os eventos antigos dos
  # repositórios Hugo continuam aceitos e só regeram o site novo.
  repository_dispatch:
    types: [trigger-site, trigger-portfolio, trigger-blog]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Código do site (repositório privado: usa o token pessoal)
      - name: Checkout do site
        uses: actions/checkout@v4
        with:
          repository: Thneppel/ThneppelSite
          path: site
          token: ${{ secrets.PERSONAL_TOKEN }}

      # 2. Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # 3. Build (gera site/dist com páginas, redirecionamentos, sitemap e robots.txt)
      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build

      # 4. Arquivos do GitHub Pages
      - name: Preparar publicação
        run: |
          touch site/dist/.nojekyll                       # evita interferência do Jekyll
          echo "thneppel.com.br" > site/dist/CNAME        # domínio

      # 5. Publicar na branch pages (substitui o site anterior por completo)
      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./site/dist
          publish_branch: pages
          keep_files: false
