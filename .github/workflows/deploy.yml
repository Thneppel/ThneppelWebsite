name: Deploy

# Gera o site (Astro) e publica na branch pages do GitHub Pages (thneppel.com.br).
on:
  push:
    branches: [ main ]
  # Permite disparo manual (Actions > Deploy > Run workflow)
  workflow_dispatch:

# O token automático do Actions precisa escrever na branch pages.
permissions:
  contents: write

# Um deploy por vez; um push novo cancela o que ainda estiver rodando.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Gera dist/ com páginas, redirecionamentos, sitemap e robots.txt
      - name: Build
        run: |
          npm ci
          npm run build

      - name: Preparar publicação
        run: |
          touch dist/.nojekyll                       # evita interferência do Jekyll
          echo "thneppel.com.br" > dist/CNAME        # domínio

      # Publica na branch pages (substitui o site anterior por completo)
      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: pages
          keep_files: false
